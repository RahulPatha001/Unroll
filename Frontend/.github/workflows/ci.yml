name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch. Free minutes are not infinite, and
# a push that lands five minutes after the previous one does not need both runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint and format
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and contract tests
        run: npm test

  parity:
    name: 4-language translation parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # The three toolchains the harness needs. `ubuntu-latest` ships python3 and
      # g++; the JDK is the one not guaranteed, so install it explicitly. The
      # harness compiles via `java -m jdk.compiler/...`, so no javac binary and no
      # separate JDK step is needed beyond this. See plan §10.1.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Verify every language agrees
        # The point of the whole exercise: a Java snippet that compiles, looks
        # plausible and computes the wrong thing must fail here, not in front of
        # a student. See plan §5.4.
        run: npm run verify:langs

  e2e:
    name: build, budget, end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: node tools/budget.mjs
      - name: Token layer emits CSS
        # A misspelled or undeclared token renders as an element with no colour
        # and a green build. The unit test catches typos; only this, reading the
        # built CSS, catches a token that was never declared.
        run: npm run check:tokens
      - name: E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual:
    name: layout and screenshot baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        # The baselines are rasterised by one engine and only that engine
        # compares them, so a WebKit or Firefox run would fail on font metrics
        # alone. Chromium only, deliberately.
        run: npx playwright install --with-deps chromium
      - name: Build
        # A dev server would make every baseline a lie: a different module
        # graph, different font loading, an HMR client in the picture.
        run: npm run build
      - name: Geometry and screenshot baselines
        run: npm run test:visual
      - name: Upload baseline diffs
        # Both images, not just the actual. A pixel diff nobody can see is a
        # pixel diff nobody will believe, and "it looks the same to me" is how a
        # real regression gets merged.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-diffs
          path: |
            tests/visual/screens.spec.ts-snapshots/*-diff.png
            tests/visual/screens.spec.ts-snapshots/*-actual.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-visual
          path: playwright-report/
          retention-days: 7
