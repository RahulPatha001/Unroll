name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch. Free minutes are not infinite, and
# a push that lands five minutes after the previous one does not need both runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint and format
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and contract tests
        run: npm test

  parity:
    name: 4-language translation parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # The three toolchains the harness needs. `ubuntu-latest` ships python3 and
      # g++; the JDK is the one not guaranteed, so install it explicitly. The
      # harness compiles via `java -m jdk.compiler/...`, so no javac binary and no
      # separate JDK step is needed beyond this. See plan §10.1.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Verify every language agrees
        # The point of the whole exercise: a Java snippet that compiles, looks
        # plausible and computes the wrong thing must fail here, not in front of
        # a student. See plan §5.4.
        run: npm run verify:langs

  e2e:
    name: build, budget, end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: node tools/budget.mjs
      - name: E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
