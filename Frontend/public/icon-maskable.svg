<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Unroll">
  <title>Unroll</title>
  <!--
    The maskable variant: the same mark, on a plate the launcher is allowed to crop.

    A separate file rather than a copy, because Android may eat everything outside
    the central 80% — a circle, a squircle, a rounded square, whichever the launcher
    wants. The regular favicon fills its rounded square edge to edge, so handing that
    file over as `purpose: "maskable"` promises a safe zone it does not have: a
    circular launcher clips the corners, and a squircle one clips the outer thirds of
    the cell row, which is the part of the mark doing the most work.

    So the mark is scaled to 66% and centred on a full-bleed background with no
    corners of its own — the launcher supplies the shape. The content then sits
    within a radius of about 7.3 units against the 12.8 allowed.
  -->
  <rect width="32" height="32" fill="#0f172a" />
  <g transform="translate(16 16) scale(0.66) translate(-16 -16)">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1e293b" />
        <stop offset="1" stop-color="#0f172a" />
      </linearGradient>
      <linearGradient id="cell-active" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fbbf24" />
        <stop offset="1" stop-color="#f59e0b" />
      </linearGradient>
      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="0.5" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
    <rect x="0.5" y="0.5" width="31" height="31" rx="9" fill="url(#bg)" stroke="#334155" stroke-width="1" />
    <path d="M12.9 9.2 L16 5 L19.1 9.2 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="0.4" stroke-linejoin="round" />
    <rect x="15.2" y="9.2" width="1.6" height="2.6" rx="0.4" fill="#fbbf24" />
    <rect x="4.5" y="15" width="6" height="11" rx="1.5" fill="#475569" />
    <rect x="13" y="15" width="6" height="11" rx="1.5" fill="url(#cell-active)" filter="url(#glow)" />
    <rect x="21.5" y="15" width="6" height="11" rx="1.5" fill="#1e293b" stroke="#334155" stroke-width="0.5" />
  </g>
</svg>
